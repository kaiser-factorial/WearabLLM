<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WearabLLM Console</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <p class="eyebrow">WearabLLM</p>
          <h1>Sphere</h1>
          <p class="tagline">Shared mind across home base, web, and wearable bodies.</p>
        </div>

        <section class="panel">
          <div class="panel-head">
            <h2>Bodies</h2>
            <span id="status" class="status connecting"><span></span> Connecting</span>
          </div>
          <div id="device-list" class="device-list" role="listbox" aria-label="Device bodies"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Session</h2>
            <button id="reset-session" type="button" class="ghost">Archive &amp; reset</button>
          </div>
          <dl id="session-meta" class="session-meta">
            <div><dt>Active</dt><dd id="session-active">—</dd></div>
            <div><dt>Turns</dt><dd id="session-turns">0</dd></div>
            <div><dt>Filter</dt><dd id="session-filter">All bodies</dd></div>
          </dl>
        </section>

        <section class="panel soft">
          <h2>Event feed</h2>
          <p class="hint">Device interaction log (mic → LED/TTS). Distinct from the shared chat thread.</p>
          <div id="event-feed" class="event-feed" aria-live="polite"></div>
        </section>
      </aside>

      <main class="stage">
        <header class="stage-head">
          <div>
            <p class="eyebrow">Conversation</p>
            <h2 id="thread-title">All bodies</h2>
          </div>
          <div class="stage-actions">
            <button id="refresh" type="button" class="ghost">Refresh</button>
          </div>
        </header>

        <section id="thread" class="thread" aria-live="polite"></section>

        <footer class="composer">
          <div class="composer-meta">
            <label for="reply-as">Reply as</label>
            <select id="reply-as"></select>
            <span id="composer-hint" class="hint">Continues the shared principal thread</span>
          </div>
          <form id="reply-form" class="reply-form">
            <textarea
              id="reply-input"
              rows="3"
              maxlength="2000"
              placeholder="Type to continue the conversation from here…"
              required
            ></textarea>
            <div class="composer-actions">
              <p id="composer-status" class="hint"></p>
              <button id="send" type="submit">Send</button>
            </div>
          </form>
        </footer>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
